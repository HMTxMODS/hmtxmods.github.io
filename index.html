<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HMTxMODS - Mod APK & Game Downloads</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="white">HMTx</span><span class="teal">MODS</span>
      </div>
      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search mods..." />
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <!-- APPS SECTION -->
    <section>
      <div class="section-title">
        <h2>Latest Apps</h2>
      </div>
      <div class="cards-list" id="appsList"></div>
      <p class="no-results" id="noApps" style="display:none;">No apps found.</p>
    </section>

    <!-- GAMES SECTION -->
    <section>
      <div class="section-title games">
        <h2>Latest Games</h2>
      </div>
      <div class="cards-list" id="gamesList"></div>
      <p class="no-results" id="noGames" style="display:none;">No games found.</p>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
