<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download - HMTxMODS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <a href="index.html" class="download-back" id="backBtn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        Back
      </a>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="download-card" id="downloadCard">
      <div class="download-card-topline" id="topLine"></div>

      <img id="appIcon" class="download-icon" src="" alt="" />
      <h1 class="download-name" id="appName"></h1>
      <p class="download-meta" id="appMeta"></p>

      <div class="download-tags" id="appTags"></div>

      <p class="download-desc" id="appDesc"></p>

      <!-- COUNTDOWN -->
      <div class="countdown-box">
        <div class="countdown-wrap" id="countdownWrap">
          <div class="countdown-ring">
            <svg viewBox="0 0 80 80">
              <circle class="ring-bg" cx="40" cy="40" r="36"/>
              <circle class="ring-progress" id="ringProgress" cx="40" cy="40" r="36"/>
            </svg>
            <span class="countdown-number" id="countdownNum">10</span>
          </div>
          <p class="countdown-text">Preparing secure download links...</p>
        </div>

        <!-- DOWNLOAD BUTTONS -->
        <div class="download-links fade-in" id="downloadLinks">
          <a class="dl-btn mediafire" id="btnMediafire" href="#">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            Download via MediaFire
          </a>
          <a class="dl-btn mega" id="btnMega" href="#">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            Download via MEGA
          </a>
          <a class="dl-btn gdrive" id="btnGdrive" href="#">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            Download via Google Drive
          </a>
        </div>
      </div>

      <!-- BADGES -->
      <div class="download-badges">
        <div class="badge safe">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
          <span class="badge-label">Virus Free</span>
        </div>
        <div class="badge fast">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          <span class="badge-label">Fast Servers</span>
        </div>
      </div>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="download.js"></script>
</body>
</html>
